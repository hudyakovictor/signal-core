version: '3.8'

services:
  game-server:
    build:
      context: .
      dockerfile: services/game-server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    restart: unless-stopped

  admin-core:
    build:
      context: .
      dockerfile: services/admin-core/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASS:-postgres}@postgres:5432/signal_core
      - ADMIN_VPN_ALLOWED_CIDR=10.0.0.0/8
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
      POSTGRES_DB: signal_core
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - internal

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  pg_data:
  redis_data:

networks:
  internal:
    internal: true
