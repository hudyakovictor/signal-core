name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
        working-directory: apps/game-client
      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/game-client
      - name: Build
        run: npm run build
        working-directory: apps/game-client
